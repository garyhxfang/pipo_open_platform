name: Capability Map Check

on:
  pull_request:
    paths:
      - 'capability-map/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/capability-map-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build capability map
        run: npm run capability:build
